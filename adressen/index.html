<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Adressen Cortasiell</title>

    <link rel="stylesheet" href="../shared/theme.css">
    <link rel="stylesheet" href="style.css">

    <link rel="icon" href="../shared/icons/icon-192.png">
    <meta name="theme-color" content="#3f4859">
</head>

<body>

    <div class="kopfzeile">
        <h1>Adressen</h1>
        <button class="icon-btn" onclick="window.hilfeOeffnen()" aria-label="Hilfe" title="Hilfe">?</button>
        <a href="../" class="icon-btn" aria-label="Startseite" title="Startseite">
            <svg viewBox="0 0 24 24" width="22" height="22"><path d="M12 3l9 8h-3v9h-5v-6H11v6H6v-9H3z" fill="currentColor"/></svg>
        </a>
    </div>

    <div id="hilfeOverlay" class="overlay hidden">
        <div class="sheet">
            <div class="sheet-head">
                <h2>Hilfe</h2>
                <button class="icon-btn" onclick="window.hilfeSchliessen()">✕</button>
            </div>
            <p>
                Klicke auf eine Adresse, um sie zu bearbeiten. Die Liste ist
                immer alphabetisch nach Name/Firma sortiert. "Bezeichnung"
                ist frei wählbar, z.B. Gärtner, Nachbar, Maurer.
            </p>
        </div>
    </div>

    <div class="aktionsleiste">
        <button onclick="window.neueAdresse()">+ Neue Adresse</button>
    </div>

    <div class="adressen-spaltenkopf">
        <span>Bezeichnung</span>
        <span>Name/Firma</span>
        <span>Vorname</span>
        <span>Ort</span>
        <span>Telefon</span>
        <span>E-Mail</span>
        <span>Web</span>
        <span></span>
    </div>

    <div id="adressenListe" class="adressen-liste">
        <p class="hinweis-text">Lädt…</p>
    </div>

    <!-- Editor -->
    <div id="editorOverlay" class="overlay hidden">
        <div class="sheet">
            <div class="sheet-head">
                <h2 id="editorTitel">Neue Adresse</h2>
                <button class="icon-btn" onclick="window.schliesseEditor()">✕</button>
            </div>

            <div class="form-group">

                <label>Bezeichnung</label>
                <input type="text" id="inputBezeichnung" placeholder="z.B. Gärtner, Nachbar, Maurer">

                <div class="zwei-spalten">
                    <div>
                        <label>Name oder Firma</label>
                        <input type="text" id="inputName" placeholder="z.B. Meier">
                    </div>
                    <div>
                        <label>Vorname</label>
                        <input type="text" id="inputVorname" placeholder="z.B. Hans">
                    </div>
                </div>

                <label>Ort</label>
                <input type="text" id="inputOrt" placeholder="z.B. Zürich">

                <div class="zwei-spalten">
                    <div>
                        <label>Telefon</label>
                        <input type="tel" id="inputTel" placeholder="z.B. 079 123 45 67">
                    </div>
                    <div>
                        <label>E-Mail</label>
                        <input type="email" id="inputMail" placeholder="z.B. hans@meier.ch">
                    </div>
                </div>

                <label>Webseite</label>
                <input type="url" id="inputWebseite" placeholder="z.B. https://meier.ch">

            </div>

            <div class="form-aktionen">
                <button onclick="window.adresseSpeichern()">Speichern</button>
                <button class="abbrechen-button" onclick="window.schliesseEditor()">Abbrechen</button>
            </div>

        </div>
    </div>

    <script type="module" src="adressen.js"></script>

</body>
</html>
