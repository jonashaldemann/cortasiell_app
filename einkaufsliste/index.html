<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Einkaufsliste Cortasiell</title>

    <link rel="stylesheet" href="../shared/theme.css">
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">

    <link rel="icon" href="icons/icon-192.png">
    <link rel="apple-touch-icon" href="icons/icon-192.png">
    <meta name="theme-color" content="#f9d988">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Einkaufen">
</head>

<body>

    <div class="container">

        <div class="kopfzeile">
            <h1>Einkaufsliste</h1>
            <a href="../" class="icon-btn" aria-label="Startseite" title="Startseite">
                <svg viewBox="0 0 24 24" width="22" height="22"><path d="M12 3l9 8h-3v9h-5v-6H11v6H6v-9H3z" fill="currentColor"/></svg>
            </a>
        </div>

        <div class="hinzufuegen-reihe">
            <input
                type="text"
                id="neuesElementFeld"
                placeholder="z.B. Milch"
                onkeydown="if(event.key==='Enter'){event.preventDefault();window.elementHinzufuegen();}"
            >
            <button onclick="window.elementHinzufuegen()">Hinzufügen</button>
        </div>

        <div id="filterLeiste" class="filter-reihe"></div>

        <div id="aktiveListe" class="einkaufs-liste" ondragover="window.dragOverListe(event)" ondrop="window.dragDrop(event)"></div>

        <div id="erledigtBereich"></div>

    </div>

    <script type="module" src="einkaufsliste.js"></script>

</body>
</html>
