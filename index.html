<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cortasiell-App</title>

    <link rel="stylesheet" href="shared/theme.css">
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">

    <link rel="icon" href="shared/icons/icon-192.png">
    <link rel="apple-touch-icon" href="shared/icons/icon-192.png">
    <meta name="theme-color" content="#12354e">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Cortasiell">
</head>

<body>

    <header class="topbar">
        <h1>Cortasiell</h1>
    </header>

    <main>

        <div class="tile-grid">

            <a class="tile" href="./inventar/" title="Vorräte und Einrichtung erfassen">
                <span class="tile-icon" style="background:var(--akzent-inventar)">
                    <svg viewBox="0 0 24 24" width="28" height="28" fill="currentColor">
                        <path d="M12 2.2 3 6.8v10.4l9 4.6 9-4.6V6.8L12 2.2Zm0 2.24 6.46 3.3L12 11.04 5.54 7.74 12 4.44ZM5 9.3l6 3.06v7.86L5 17.16V9.3Zm8 10.92v-7.86l6-3.06v7.86l-6 3.06Z"/>
                    </svg>
                </span>
                <span class="tile-label">Inventar</span>
            </a>

            <a class="tile" href="./kalender/" title="Ferien und Aktivitäten eintragen">
                <span class="tile-icon" style="background:var(--akzent-kalender)">
                    <svg viewBox="0 0 24 24" width="28" height="28" fill="currentColor">
                        <path d="M8 2a1 1 0 0 1 1 1v1h6V3a1 1 0 1 1 2 0v1h1a2 2 0 0 1 2 2v13a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h1V3a1 1 0 0 1 1-1ZM6 10v9h12v-9H6Zm2 2h3v3H8v-3Z"/>
                    </svg>
                </span>
                <span class="tile-label">Kalender</span>
            </a>

            <a class="tile" href="./projekte/" title="Projekte planen und verfolgen">
                <span class="tile-icon" style="background:var(--akzent-reserve)">
                    <svg viewBox="0 0 24 24" width="28" height="28" fill="currentColor">
                        <path d="M9 2a1 1 0 0 0-1 1H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V5a2 2 0 0 0-2-2h-2a1 1 0 0 0-1-1H9Zm0 2h6v2H9V4ZM7 11.5 8.4 10.1 10.5 12.2 15.6 7.1 17 8.5 10.5 15 7 11.5Z"/>
                    </svg>
                </span>
                <span class="tile-label">Projekte</span>
            </a>

            <a class="tile" href="./einkaufsliste/" title="Gemeinsame Einkaufsliste">
                <span class="tile-icon" style="background:var(--akzent-einkauf)">
                    <svg viewBox="0 0 24 24" width="28" height="28" fill="currentColor">
                        <path d="M7 4H5a1 1 0 0 0 0 2h1.28l.33 1.3 1.6 6.4A2 2 0 0 0 10.15 15.4h6.7a2 2 0 0 0 1.94-1.52l1.4-5.6A1 1 0 0 0 19.22 7H7.8l-.5-2H7Zm1.8 5h10.4l-1.2 4.9H10Zm.7 9.5a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3Zm7 0a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3Z"/>
                    </svg>
                </span>
                <span class="tile-label">Einkaufsliste</span>
            </a>

            <a class="tile" href="./menuplan/" title="Menüplan für die nächsten vier Wochen">
                <span class="tile-icon" style="background:var(--akzent-menueplan)">
                    <svg viewBox="0 0 24 24" width="28" height="28" fill="currentColor">
                        <path d="M6 2a1 1 0 0 1 1 1v6.5a1.5 1.5 0 0 1-1 1.41V22H4v-11.09A1.5 1.5 0 0 1 3 9.5V3a1 1 0 0 1 2 0v5h.5V3a1 1 0 0 1 1-1Zm3 0a1 1 0 0 1 1 1v5h.5V3a1 1 0 1 1 2 0v6.5a1.5 1.5 0 0 1-1 1.41V22H9.5v-11.09A1.5 1.5 0 0 1 8.5 9.5V3a1 1 0 0 1 .5-1Zm9 0c-1.66 0-4 2.24-4 6s2 5 3 5.3V22h2V2.06A1 1 0 0 0 18 2Z"/>
                    </svg>
                </span>
                <span class="tile-label">Menüplan</span>
            </a>

            <a class="tile" href="./notizen/" title="Notizen für alles, was sonst keinen Platz hat">
                <span class="tile-icon" style="background:var(--akzent-notizen)">
                    <svg viewBox="0 0 24 24" width="28" height="28" fill="currentColor">
                        <path d="M5 3a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10.17a2 2 0 0 0 1.42-.59l3.83-3.82a2 2 0 0 0 .58-1.42V5a2 2 0 0 0-2-2H5Zm0 2h14v9h-3.5A1.5 1.5 0 0 0 14 15.5V19H5V5Zm2 3v2h10V8H7Zm0 4v2h6v-2H7Z"/>
                    </svg>
                </span>
                <span class="tile-label">Notizen</span>
            </a>

        </div>

    </main>

    <script src="app.js"></script>

</body>
</html>
