<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Notizen Cortasiell</title>

    <link rel="stylesheet" href="../shared/theme.css">
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">

    <link rel="icon" href="icons/icon-192.png">
    <link rel="apple-touch-icon" href="icons/icon-192.png">
    <meta name="theme-color" content="#939081">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Notizen">
</head>

<body>

    <div class="kopfzeile">
        <h1>Notizen</h1>
        <button class="icon-btn" onclick="window.hilfeOeffnen()" aria-label="Hilfe" title="Hilfe">?</button>
        <a href="../" class="icon-btn" aria-label="Startseite" title="Startseite">
            <svg viewBox="0 0 24 24" width="22" height="22"><path d="M12 3l9 8h-3v9h-5v-6H11v6H6v-9H3z" fill="currentColor"/></svg>
        </a>
    </div>

    <div id="hilfeOverlay" class="overlay hidden">
        <div class="sheet">
            <div class="sheet-head">
                <h2>Hilfe</h2>
                <button class="icon-btn" onclick="window.hilfeSchliessen()">✕</button>
            </div>
            <p>
                Für alles, was sonst nirgends Platz hat: Text eintragen,
                Namen dazuschreiben, fertig. Klick auf eine Notiz, um sie
                zu bearbeiten.
            </p>
        </div>
    </div>

    <div class="neue-notiz">
        <textarea id="neueNotizText" placeholder="Neue Notiz…" rows="3"></textarea>
        <div class="neue-notiz-reihe">
            <input type="text" id="neueNotizName" placeholder="Dein Name" onchange="window.notizNameGeaendert()">
            <button onclick="window.notizHinzufuegen()">Hinzufügen</button>
        </div>
    </div>

    <div id="notizenListe" class="notizen-liste">
        <p class="hinweis-text">Lädt…</p>
    </div>

    <script type="module" src="notizen.js"></script>

</body>
</html>
