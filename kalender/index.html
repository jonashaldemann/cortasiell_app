<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Kalender Cortasiell</title>

    <link rel="stylesheet" href="../shared/theme.css">
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">

    <link rel="icon" href="icons/icon-192.png">
    <link rel="apple-touch-icon" href="icons/icon-192.png">
    <meta name="theme-color" content="#a62c37">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Kalender">
</head>

<body>

    <div class="container">

        <div class="kopfzeile">
            <h1>Kalender</h1>
            <button class="icon-btn" onclick="window.hilfeOeffnen()" aria-label="Hilfe" title="Hilfe">?</button>
            <a href="../" class="icon-btn" aria-label="Startseite" title="Startseite">
                <svg viewBox="0 0 24 24" width="22" height="22"><path d="M12 3l9 8h-3v9h-5v-6H11v6H6v-9H3z" fill="currentColor"/></svg>
            </a>
        </div>

        <div class="kalender-layout">

            <div class="kalender-hauptspalte">
                <div id="ansichtUmschalter"></div>
                <div id="monatsNavigation"></div>
                <div id="kalenderGrid"></div>
            </div>

            <div id="auswahlLeiste" class="kalender-seitenpanel"></div>

        </div>

    </div>

    <div id="hilfeOverlay" class="overlay hidden">
        <div class="sheet">
            <div class="sheet-head">
                <h2>Hilfe</h2>
                <button class="icon-btn" onclick="window.hilfeSchliessen()">✕</button>
            </div>
            <p>
                Tippe auf einen oder mehrere Tage, um dich (oder andere)
                einzutragen. Mit Shift+Klick wählst du gleich einen ganzen
                Zeitraum aus. Unten kannst du Namen hinzufügen/entfernen und
                eine Aktivität für die ausgewählten Tage eintragen.
            </p>
        </div>
    </div>

    <script type="module" src="calendar.js"></script>

</body>
</html>
